<div class="container mx-auto p-4 max-w-md">
    <!-- Channel Link -->
    <a href="APNA_WHATSAPP_CHANNEL_LINK_YAHAN_DAALEN" target="_blank" class="block bg-blue-600 text-white text-center py-2 rounded-lg font-bold mb-4 shadow">📢 Mera WhatsApp Channel Join Karein</a>

    <!-- Search Bar -->
    <input type="text" id="searchInput" oninput="filterGroups()" placeholder="Group search karein..." class="w-full p-3 border rounded-lg mb-4">
    
    <div id="group-list" class="space-y-4"></div>
</div>

<script type="module">
    // ... (Firebase initialization wahi rahega) ...
    // ... (loadGroups function me data fetch karne ke baad yeh logic add karein) ...
    
    window.filterGroups = () => {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const cards = document.querySelectorAll('.group-card');
        cards.forEach(card => {
            const name = card.querySelector('h3').innerText.toLowerCase();
            card.style.display = name.includes(query) ? "block" : "none";
        });
    }
</script>
