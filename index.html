<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp & Telegram Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Search Console -->
    <meta name="google-site-verification" content="08OzcHHZTGB8Z5PVdvlCQQahUKPWVJVC84Cee5B-IEw" />
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-[#007b5e] text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-black">Group & Channel Hub 🚀</h1>
        <div class="max-w-md mx-auto mt-4">
            <input type="text" id="searchInput" oninput="displayFilteredGroups()" placeholder="🔍 Group search karein..." class="w-full p-3 rounded-xl text-gray-800 text-sm focus:outline-none shadow">
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Filter Buttons -->
        <div class="flex gap-2 overflow-x-auto pb-3 mb-2">
            <button onclick="filterType('all')" class="bg-gray-800 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">All</button>
            <button onclick="filterType('WhatsApp')" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">WhatsApp</button>
            <button onclick="filterType('Telegram')" class="bg-sky-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">Telegram</button>
        </div>

        <!-- Groups List -->
        <div id="group-list" class="space-y-6"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d"
        }));

        let allGroups = [];
        let currentFilter = 'all';

        async function loadGroups() {
            const querySnapshot = await getDocs(collection(db, "groups"));
            querySnapshot.forEach((doc) => allGroups.push(doc.data()));
            render();
        }

        window.filterType = (type) => { currentFilter = type; render(); }
        window.displayFilteredGroups = () => { render(); }

        function render() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            let filtered = allGroups.filter(g => 
                (currentFilter === 'all' || g.type.includes(currentFilter)) &&
                (g.name.toLowerCase().includes(query))
            );

            const whatsappGroups = filtered.filter(g => g.type.includes('WhatsApp'));
            const telegramGroups = filtered.filter(g => g.type.includes('Telegram'));

            // WhatsApp Section
            if(whatsappGroups.length > 0) {
                listDiv.innerHTML += `<h2 class="font-bold text-green-700 text-lg border-b border-green-200 pb-1">🟢 WhatsApp</h2>`;
                whatsappGroups.forEach(g => listDiv.innerHTML += createCard(g, 'bg-green-50', 'bg-green-600'));
            }

            // Telegram Section (Niche aayega)
            if(telegramGroups.length > 0) {
                listDiv.innerHTML += `<h2 class="font-bold text-sky-700 text-lg border-b border-sky-200 pb-1 pt-4">🔵 Telegram</h2>`;
                telegramGroups.forEach(g => listDiv.innerHTML += createCard(g, 'bg-sky-50', 'bg-sky-500'));
            }
        }

        function createCard(g, bg, btnColor) {
            return `
                <div class="${bg} p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-3">
                    <h4 class="font-bold text-gray-800">${g.name}</h4>
                    <div class="flex gap-2">
                        <button onclick="navigator.clipboard.writeText('${g.link}'); alert('Copied!')" class="bg-gray-200 px-4 py-2 rounded-lg text-xs font-bold">📋 Copy</button>
                        <a href="${g.link}" target="_blank" class="${btnColor} text-white flex-1 text-center py-2 rounded-lg font-bold text-xs">Join Link</a>
                    </div>
                </div>
            `;
        }

        loadGroups();
    </script>
</body>
</html>
