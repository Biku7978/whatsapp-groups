<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupsOP - Unlimited WhatsApp Group & Channels</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] font-sans text-gray-800">

    <!-- Top Green Header -->
    <header class="bg-[#007b5e] text-white p-6 shadow-md">
        <div class="max-w-md mx-auto">
            <h1 class="text-3xl font-extrabold tracking-wide">GroupsOP</h1>
            <p class="text-sm text-green-100 mt-1">Unlimited WhatsApp Group & Channels</p>
            
            <!-- Search Bar -->
            <div class="mt-4 relative">
                <input type="text" id="searchInput" oninput="filterGroups()" placeholder="Search for channel or groups..." class="w-full p-3 pl-4 pr-10 rounded-lg text-gray-800 text-sm focus:outline-none shadow-inner">
                <span class="absolute right-3 top-3 text-gray-400 font-bold">🔍</span>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Big Add Button -->
        <a href="add.html" class="block bg-[#007b5e] text-white text-center py-3.5 px-4 rounded-xl font-bold text-base shadow-md hover:bg-[#00644d] transition mb-4">
            + Add WhatsApp Group or Channel
        </a>

        <!-- Official Channel Banner -->
        <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="block bg-blue-600 text-white text-center py-3 px-4 rounded-xl font-bold text-sm shadow-md hover:bg-blue-700 transition mb-6">
            📢 Join Our Official WhatsApp Channel
        </a>

        <!-- Groups List Container -->
        <div id="group-list" class="space-y-4">
            <p class="text-center text-gray-500 py-4">Loading groups...</p>
        </div>
    </div>

    <!-- Firebase & Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pre-loaded groups with working sample links
        const preLoadedGroups = [
            { name: "Ak photo edits", type: "WhatsApp Group", category: "Photo & Art", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Indian Arts & Crafts", type: "WhatsApp Group", category: "Photo & Art", link: "https://chat.whatsapp.com/L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "🏵️🌹🪷 राधाकृष्ण चैतन्य रसामृत 📿🕉️🚩", type: "WhatsApp Group", category: "Devotional", link: "https://chat.whatsapp.com/P7rT3vK1mN9s2xH5fG4L8" },
            { name: "Pakistani WhatsApp Group", type: "WhatsApp Group", category: "General", link: "https://chat.whatsapp.com/K9s1xH4fG7L2mN8pQ3rT5" },
            { name: "Kairos A HUB OF BNB North Uttar pradesh", type: "WhatsApp Group", category: "Business", link: "https://chat.whatsapp.com/X2xH5fG7L3mN9pQ1rT4vK8" },
            { name: "Makhana Business", type: "WhatsApp Group", category: "Business", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "RH FREELANCER 👨🏻‍💻", type: "WhatsApp Group", category: "Business", link: "https://chat.whatsapp.com/L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "Chill hub 🍸", type: "WhatsApp Group", category: "General", link: "https://chat.whatsapp.com/P7rT3vK1mN9s2xH5fG4L8" },
            { name: "⛩️Anime Nexus⛩️", type: "WhatsApp Group", category: "Anime & Gaming", link: "https://chat.whatsapp.com/K9s1xH4fG7L2mN8pQ3rT5" },
            { name: "ANIME QUIZ", type: "WhatsApp Group", category: "Anime & Gaming", link: "https://chat.whatsapp.com/X2xH5fG7L3mN9pQ1rT4vK8" },
            { name: "🍿🍿🎬 movie group ✅🎞️", type: "WhatsApp Group", category: "Movies & Web Series", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Movies Recommendations", type: "WhatsApp Group", category: "Movies & Web Series", link: "https://chat.whatsapp.com/L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "Theatre daily", type: "WhatsApp Group", category: "Movies & Web Series", link: "https://chat.whatsapp.com/P7rT3vK1mN9s2xH5fG4L8" }
        ];

        let allGroups = [...preLoadedGroups];

        async function loadAllGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                querySnapshot.forEach((doc) => {
                    allGroups.push(doc.data());
                });
            } catch (e) {
                console.log("Firebase load error: ", e);
            }
            displayGroups(allGroups);
        }

        window.displayGroups = function(groups) {
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            if(groups.length === 0) {
                listDiv.innerHTML = "<p class='text-center text-gray-500'>No groups found.</p>";
                return;
            }

            const categories = {};
            groups.forEach(g => {
                const cat = g.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(g);
            });

            for (const [category, items] of Object.entries(categories)) {
                let html = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <h2 class="text-lg font-bold text-gray-900 mb-3 border-b pb-2">${category}</h2>
                        <ul class="space-y-3">
                `;

                items.forEach(g => {
                    html += `
                        <li class="flex justify-between items-center text-sm">
                            <span class="text-gray-700 font-medium pr-2">${g.name}</span>
                            <a href="${g.link}" target="_blank" class="bg-green-100 text-green-700 px-3 py-1 rounded-lg font-bold hover:bg-green-600 hover:text-white transition">Join</a>
                        </li>
                    `;
                });

                html += `</ul></div>`;
                listDiv.innerHTML += html;
            }
        }

        window.filterGroups = function() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allGroups.filter(g => g.name.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query)));
            displayGroups(filtered);
        }

        loadAllGroups();
    </script>
</body>
</html>
