<html lang="hi">
<head>
    <meta charset="UTF-8">

<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-[#007b5e] text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-black">Group & Channel Hub 🚀</h1>
        <div class="max-w-md mx-auto mt-4">
            <input type="text" id="searchInput" oninput="render()" placeholder="🔍 Group search karein..." class="w-full p-3 rounded-xl text-gray-800 text-sm focus:outline-none shadow">
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Action Buttons -->
        <div class="flex gap-2 mb-3">
            <a href="add.html" class="flex-1 bg-[#007b5e] text-white text-center py-3 rounded-xl font-bold text-sm shadow">+ Add Link</a>
            <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-3 rounded-xl font-bold text-sm shadow">📢 Channel</a>
        </div>

        <!-- Direct Link Banner Button -->
        <div class="mb-4">
            <a href="https://omg10.com/4/11615866" target="_blank" class="block bg-gradient-to-r from-amber-500 to-orange-600 text-white text-center py-3 rounded-xl font-black text-xs shadow hover:opacity-95 transition">🔥 Special Offer / Exclusive Content (Click Here)</a>
        </div>

        <!-- Filter Buttons -->
        <div class="flex gap-2 overflow-x-auto pb-3 mb-2">
            <button onclick="filterType('all')" class="bg-gray-800 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">All</button>
            <button onclick="filterType('WhatsApp')" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">WhatsApp</button>
            <button onclick="filterType('Telegram')" class="bg-sky-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">Telegram</button>
        </div>

        <!-- Groups List -->
        <div id="group-list" class="space-y-6">
            <p class="text-center text-gray-500 py-4">Loading groups...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d"
        }));

        const preLoadedGroups = [
            { name: "Only Girls Chat Zone", type: "WhatsApp Group", category: "Girls Group", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Latest Movies Hub", type: "WhatsApp Channel", category: "Movies", link: "https://whatsapp.com/channel/0029V1TechTipsHub" },
            { name: "Anime Nexus Official", type: "Telegram Group", category: "Gaming", link: "https://t.me/+J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Coding & Development (TG)", type: "Telegram Channel", category: "Technology", link: "https://t.me/+P7rT3vK1mN9s2xH5fG4L8" }
        ];

        let allGroups = [...preLoadedGroups];
        let currentFilter = 'all';

        async function loadGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                querySnapshot.forEach((doc) => {
                    allGroups.push(doc.data());
                });
            } catch (e) {
                console.log(e);
            }
            render();
        }

        window.filterType = (type) => { 
            currentFilter = type; 
            render(); 
        }

        window.render = function() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            let filtered = allGroups.filter(g => {
                const matchType = currentFilter === 'all' || (g.type && g.type.includes(currentFilter));
                const matchQuery = g.name.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query));
                return matchType && matchQuery;
            });

            if(filtered.length === 0) {
                listDiv.innerHTML = "<div class='bg-white p-4 rounded-xl text-center text-gray-500 shadow-sm'>Koi group nahi mila.</div>";
                return;
            }

            const whatsappGroups = filtered.filter(g => !g.type || g.type.includes('WhatsApp'));
            const telegramGroups = filtered.filter(g => g.type && g.type.includes('Telegram'));

            if(whatsappGroups.length > 0) {
                let waHtml = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-green-100">
                        <h2 class="text-base font-black text-green-700 mb-3 pb-2">🟢 WhatsApp Groups & Channels</h2>
                        <div class="space-y-3">
                `;
                whatsappGroups.forEach(g => {
                    waHtml += createCard(g, 'bg-green-50/50 border-green-100', 'bg-green-600 hover:bg-green-700');
                });
                waHtml += `</div></div>`;
                listDiv.innerHTML += waHtml;
            }

            if(telegramGroups.length > 0) {
                let tgHtml = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-sky-100 mt-4">
                        <h2 class="text-base font-black text-sky-600 mb-3 pb-2">🔵 Telegram Groups & Channels</h2>
                        <div class="space-y-3">
                `;
                telegramGroups.forEach(g => {
                    tgHtml += createCard(g, 'bg-sky-50/50 border-sky-100', 'bg-sky-500 hover:bg-sky-600');
                });
                tgHtml += `</div></div>`;
                listDiv.innerHTML += tgHtml;
            }
        }

        function createCard(g, bgClass, btnClass) {
            const shareText = encodeURIComponent(`🔥 Join this amazing group: ${g.name}\n🔗 Link: ${g.link}`);
            return `
                <div class="flex items-center justify-between ${bgClass} p-3 rounded-xl border">
                    <div class="pr-2">
                        <h4 class="font-bold text-sm text-gray-800">${g.name}</h4>
                        <div class="flex gap-1 mt-1 flex-wrap">
                            <span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-bold">${g.type || 'WhatsApp Group'}</span>
                            <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-bold">${g.category || 'General'}</span>
                        </div>
                    </div>
                    <div class="flex gap-1.5 whitespace-nowrap">
                        <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white px-2.5 py-2 rounded-xl font-bold text-xs shadow transition" title="Invite / Share">📤 Invite</a>
                        <a href="${g.link}" target="_blank" class="${btnClass} text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow transition">Join</a>
                    </div>
                </div>
            `;
        }

        loadGroups();
    </script>
</body>
</html>
