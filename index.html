<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-green-600 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">📱 WhatsApp Group Hub</h1>
        <p class="text-sm">Sabhi categories ke best WhatsApp groups yahan milege!</p>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        <!-- Search Bar -->
        <input type="text" id="search" placeholder="Group search karein..." class="w-full p-3 border rounded-lg mb-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500">

        <!-- Add Group Button -->
        <a href="add.html" class="block bg-green-500 text-white text-center py-3 rounded-lg font-bold mb-6 shadow hover:bg-green-600">+ Apna Group Add Karein</a>

        <!-- Groups List Container -->
        <div id="group-list" class="space-y-4">
            <!-- Sample Group Card -->
            <div class="bg-white p-4 rounded-lg shadow border">
                <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded font-semibold">Technology</span>
                <h3 class="font-bold text-lg mt-2">Android Developers India</h3>
                <p class="text-sm text-gray-600 mb-3">Coding aur app development ki baatein.</p>
                <a href="https://chat.whatsapp.com/example" target="_blank" class="block bg-green-600 text-white text-center py-2 rounded font-medium hover:bg-green-700">Join Group</a>
            </div>
        </div>
    </div>

</body>
</html>
