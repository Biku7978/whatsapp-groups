<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add WhatsApp Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-green-600 mb-4">Apna WhatsApp Group Jodein</h2>
        <form id="group-form">
            <label class="block text-sm font-medium mb-1">Group Name</label>
            <input type="text" id="g-name" required class="w-full p-2 border rounded mb-3">

            <label class="block text-sm font-medium mb-1">Category</label>
            <select id="g-cat" class="w-full p-2 border rounded mb-3">
                <option value="Technology">Technology</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Gaming">Gaming</option>
                <option value="Friendship">Friendship</option>
            </select>

            <label class="block text-sm font-medium mb-1">WhatsApp Group Link</label>
            <input type="url" id="g-link" placeholder="https://chat.whatsapp.com/..." required class="w-full p-2 border rounded mb-4">

            <button type="submit" id="sub-btn" class="w-full bg-green-600 text-white py-3 rounded font-bold">Submit Group</button>
        </form>
        <a href="index.html" class="block text-center text-sm text-gray-600 mt-4">← Home par wapas jayein</a>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("group-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("sub-btn");
            btn.innerText = "Saving...";
            btn.disabled = true;

            const name = document.getElementById("g-name").value;
            const category = document.getElementById("g-cat").value;
            const link = document.getElementById("g-link").value;

            try {
                await addDoc(collection(db, "groups"), {
                    name: name,
                    category: category,
                    link: link,
                    createdAt: new Date()
                });
                alert("Group successfully add ho gaya!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Kuch error aa gaya: " + error.message);
                btn.innerText = "Submit Group";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
