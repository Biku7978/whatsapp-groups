<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp & Telegram Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Monetag Verification Tag -->
    <meta name="monetag" content="336289b23e9f9528318ee8741131cfb9">

</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Top Header -->
    <header class="bg-[#007b5e] text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-black">Group & Channel Hub 🚀</h1>
        <p class="text-xs text-green-100 mt-1">Sabhi WhatsApp aur Telegram Groups ek jagah</p>
        
        <!-- Search Bar -->
        <div class="max-w-md mx-auto mt-4">
            <input type="text" id="searchInput" oninput="filterGroups()" placeholder="🔍 Group ya channel search karein..." class="w-full p-3.5 rounded-xl text-gray-800 text-sm focus:outline-none shadow bg-white">
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Action Buttons -->
        <div class="flex gap-2 mb-6">
            <a href="add.html" class="flex-1 bg-[#007b5e] text-white text-center py-3 rounded-xl font-bold text-sm shadow hover:bg-[#00644d] transition">+ Add Link</a>
            <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-3 rounded-xl font-bold text-sm shadow hover:bg-blue-700 transition">📢 Join Channel</a>
        </div>

        <!-- Groups List Container -->
        <div id="group-list" class="space-y-6">
            <p class="text-center text-gray-500 py-4">Loading groups...</p>
        </div>
    </div>

    <!-- Firebase & Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pre-loaded sample links
        const preLoadedGroups = [
            { name: "Only Girls Chat Zone", type: "WhatsApp Group", category: "Only Girls Group", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Girls Friendship Club", type: "WhatsApp Group", category: "Girls Group", link: "https://chat.whatsapp.com/L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "Latest Movies & Series Hub", type: "WhatsApp Channel", category: "Movies & Web Series", link: "https://whatsapp.com/channel/0029V1TechTipsHub" },
            { name: "Makhana Business Group", type: "WhatsApp Group", category: "Business", link: "https://chat.whatsapp.com/P7rT3vK1mN9s2xH5fG4L8" },
            { name: "Anime Nexus Official", type: "Telegram Group", category: "Gaming", link: "https://t.me/+J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Paid Movies & Drama (TG)", type: "Telegram Channel", category: "Movies & Web Series", link: "https://t.me/+L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "Coding & Devlopment Tips", type: "Telegram Channel", category: "Technology", link: "https://t.me/+P7rT3vK1mN9s2xH5fG4L8" }
        ];

        let allGroups = [...preLoadedGroups];

        async function loadGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                querySnapshot.forEach((doc) => {
                    allGroups.push(doc.data());
                });
            } catch (e) {
                console.log(e);
            }
            displayGroups(allGroups);
        }

        window.displayGroups = function(groups) {
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            if(groups.length === 0) {
                listDiv.innerHTML = "<div class='bg-white p-4 rounded-xl text-center text-gray-500 shadow-sm'>Koi group nahi mila.</div>";
                return;
            }

            const whatsappItems = groups.filter(g => !g.type || g.type.toLowerCase().includes('whatsapp'));
            const telegramItems = groups.filter(g => g.type && g.type.toLowerCase().includes('telegram'));

            if(whatsappItems.length > 0) {
                let waHtml = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-green-100">
                        <h2 class="text-base font-black text-green-700 mb-3 pb-2">🟢 WhatsApp Groups & Channels</h2>
                        <div class="space-y-3">
                `;
                whatsappItems.forEach(g => {
                    waHtml += `
                        <div class="flex items-center justify-between bg-green-50/50 p-3 rounded-xl border border-green-100">
                            <div class="pr-2">
                                <h4 class="font-bold text-sm text-gray-800">${g.name}</h4>
                                <div class="flex gap-1 mt-1 flex-wrap">
                                    <span class="text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">${g.type || 'WhatsApp Group'}</span>
                                    <span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-bold">${g.category || 'General'}</span>
                                </div>
                            </div>
                            <a href="${g.link}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow transition whitespace-nowrap">Join</a>
                        </div>
                    `;
                });
                waHtml += `</div></div>`;
                listDiv.innerHTML += waHtml;
            }

            if(telegramItems.length > 0) {
                let tgHtml = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-sky-100 mt-4">
                        <h2 class="text-base font-black text-sky-600 mb-3 pb-2">🔵 Telegram Groups & Channels</h2>
                        <div class="space-y-3">
                `;
                telegramItems.forEach(g => {
                    tgHtml += `
                        <div class="flex items-center justify-between bg-sky-50/50 p-3 rounded-xl border border-sky-100">
                            <div class="pr-2">
                                <h4 class="font-bold text-sm text-gray-800">${g.name}</h4>
                                <div class="flex gap-1 mt-1 flex-wrap">
                                    <span class="text-[10px] bg-sky-100 text-sky-800 px-2 py-0.5 rounded font-bold">${g.type}</span>
                                    <span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-bold">${g.category || 'General'}</span>
                                </div>
                            </div>
                            <a href="${g.link}" target="_blank" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow transition whitespace-nowrap">Join</a>
                        </div>
                    `;
                });
                tgHtml += `</div></div>`;
                listDiv.innerHTML += tgHtml;
            }
        }

        window.filterGroups = function() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allGroups.filter(g => g.name.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query)) || (g.type && g.type.toLowerCase().includes(query)));
            displayGroups(filtered);
        }

        loadGroups();
    </script>
</body>
</html>
