<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Group or Channel - GroupsOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold text-[#007b5e] mb-4">Add Group or Channel</h2>
        <form id="group-form">
            <label class="block text-sm font-medium mb-1">Name (Group/Channel Name)</label>
            <input type="text" id="g-name" required class="w-full p-2.5 border rounded-lg mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#007b5e]">

            <label class="block text-sm font-medium mb-1">Platform Type</label>
            <select id="g-type" class="w-full p-2.5 border rounded-lg mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#007b5e]">
                <option value="WhatsApp Group">WhatsApp Group</option>
                <option value="WhatsApp Channel">WhatsApp Channel</option>
                <option value="Telegram Group">Telegram Group</option>
                <option value="Telegram Channel">Telegram Channel</option>
            </select>

            <label class="block text-sm font-medium mb-1">Category</label>
            <select id="g-cat" class="w-full p-2.5 border rounded-lg mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#007b5e]">
                <option value="Girls Group">Girls Group</option>
                <option value="Only Girls Group">Only Girls Group</option>
                <option value="Technology">Technology</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Gaming">Gaming</option>
                <option value="Education">Education</option>
                <option value="Jobs & Internships">Jobs & Internships</option>
                <option value="Movies & Web Series">Movies & Web Series</option>
                <option value="Business">Business</option>
                <option value="Devotional">Devotional</option>
                <option value="General">General</option>
            </select>

            <label class="block text-sm font-medium mb-1">Invite Link (URL)</label>
            <input type="url" id="g-link" placeholder="https://chat.whatsapp.com/... ya https://t.me/..." required class="w-full p-2.5 border rounded-lg mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#007b5e]">

            <button type="submit" id="sub-btn" class="w-full bg-[#007b5e] text-white py-3 rounded-lg font-bold hover:bg-[#00644d] transition text-sm">Submit Now</button>
        </form>
        <a href="index.html" class="block text-center text-sm text-gray-600 mt-4 hover:underline">← Back to Home</a>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("group-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("sub-btn");
            btn.innerText = "Saving...";
            btn.disabled = true;

            const name = document.getElementById("g-name").value;
            const type = document.getElementById("g-type").value;
            const category = document.getElementById("g-cat").value;
            const link = document.getElementById("g-link").value;

            try {
                await addDoc(collection(db, "groups"), {
                    name: name,
                    type: type,
                    category: category,
                    link: link,
                    createdAt: new Date()
                });
                alert("Successfully added!");
                
                document.getElementById("g-name").value = "";
                document.getElementById("g-link").value = "";
                btn.innerText = "Submit Now";
                btn.disabled = false;
            } catch (error) {
                alert("Error: " + error.message);
                btn.innerText = "Submit Now";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
