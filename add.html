<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupsOP - Ultimate Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-[#007b5e] text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-black">GroupsOP 🚀</h1>
        <p class="text-xs text-green-100 mt-1">WhatsApp & Telegram Groups Directory</p>
        
        <!-- Search -->
        <input type="text" id="searchInput" oninput="filterGroups()" placeholder="🔍 Search groups or channels..." class="w-full mt-4 p-3 rounded-xl text-gray-800 text-sm focus:outline-none shadow">
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Action Buttons -->
        <div class="flex gap-2 mb-4">
            <a href="add.html" class="flex-1 bg-[#007b5e] text-white text-center py-3 rounded-xl font-bold text-sm shadow hover:bg-[#00644d]">+ Add Link</a>
            <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-3 rounded-xl font-bold text-sm shadow hover:bg-blue-700">📢 Join Channel</a>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
            <button onclick="filterPlatform('All')" class="bg-gray-800 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">All</button>
            <button onclick="filterPlatform('WhatsApp')" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">WhatsApp</button>
            <button onclick="filterPlatform('Telegram')" class="bg-sky-500 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">Telegram</button>
        </div>

        <!-- List -->
        <div id="group-list" class="space-y-4">
            <p class="text-center text-gray-500 py-4">Loading...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allGroups = [];
        let currentPlatform = 'All';

        async function loadGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                allGroups = [];
                querySnapshot.forEach((doc) => {
                    allGroups.push(doc.data());
                });
            } catch (e) {
                console.log(e);
            }
            displayGroups(allGroups);
        }

        window.displayGroups = function(groups) {
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            if(groups.length === 0) {
                listDiv.innerHTML = "<div class='bg-white p-4 rounded-xl text-center text-gray-500'>No groups found here.</div>";
                return;
            }

            const categories = {};
            groups.forEach(g => {
                const cat = g.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(g);
            });

            for (const [category, items] of Object.entries(categories)) {
                let html = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
                        <h2 class="text-md font-bold text-gray-900 mb-3 border-b pb-2">📂 ${category}</h2>
                        <div class="space-y-2.5">
                `;

                items.forEach(g => {
                    const type = g.type || 'WhatsApp Group';
                    const isTG = type.includes('Telegram');
                    const badgeColor = isTG ? 'bg-sky-100 text-sky-700' : 'bg-green-100 text-green-700';
                    const btnBg = isTG ? 'bg-sky-500 hover:bg-sky-600' : 'bg-green-600 hover:bg-green-700';

                    html += `
                        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${g.name}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded font-bold ${badgeColor}">${type}</span>
                            </div>
                            <a href="${g.link}" target="_blank" class="${btnBg} text-white px-4 py-1.5 rounded-lg font-bold text-xs shadow">Join</a>
                        </div>
                    `;
                });

                html += `</div></div>`;
                listDiv.innerHTML += html;
            }
        }

        window.filterPlatform = function(platform) {
            currentPlatform = platform;
            filterGroups();
        }

        window.filterGroups = function() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allGroups.filter(g => {
                const matchesSearch = g.name.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query));
                const type = g.type || 'WhatsApp Group';
                const matchesPlatform = currentPlatform === 'All' || (currentPlatform === 'WhatsApp' && type.includes('WhatsApp')) || (currentPlatform === 'Telegram' && type.includes('Telegram'));
                return matchesSearch && matchesPlatform;
            });
            displayGroups(filtered);
        }

        loadGroups();
    </script>
</body>
</html>
