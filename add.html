<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Group Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg mt-10">
        <h2 class="text-2xl font-black text-[#007b5e] mb-5 text-center">Naya Group Add Karein</h2>
        
        <div class="space-y-4">
            <input type="text" id="gName" placeholder="Group ka Naam" class="w-full p-3 border rounded-xl outline-none">
            
            <select id="gType" class="w-full p-3 border rounded-xl outline-none">
                <option value="WhatsApp Group">WhatsApp Group</option>
                <option value="WhatsApp Channel">WhatsApp Channel</option>
                <option value="Telegram Group">Telegram Group</option>
                <option value="Telegram Channel">Telegram Channel</option>
            </select>

            <input type="text" id="gCategory" placeholder="Category (e.g. Movies, Gaming)" class="w-full p-3 border rounded-xl outline-none">
            <input type="text" id="gLink" placeholder="Invite Link (https://...)" class="w-full p-3 border rounded-xl outline-none">

            <button onclick="saveGroup()" id="btnSave" class="w-full bg-[#007b5e] text-white py-3 rounded-xl font-bold hover:bg-[#00644d] transition">Submit Link</button>
            <a href="index.html" class="block text-center text-sm text-gray-500 mt-3 underline">Home Page par wapas jayein</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d"
        }));

        window.saveGroup = async function() {
            const btn = document.getElementById("btnSave");
            btn.innerText = "Saving...";
            
            try {
                await addDoc(collection(db, "groups"), {
                    name: document.getElementById("gName").value,
                    type: document.getElementById("gType").value,
                    category: document.getElementById("gCategory").value,
                    link: document.getElementById("gLink").value
                });
                alert("Success! Link add ho gaya.");
                window.location.href = "index.html";
            } catch (e) {
                alert("Error: " + e.message);
                btn.innerText = "Submit Link";
            }
        }
    </script>
</body>
</html>
