<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-green-600 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">📱 WhatsApp Group Hub</h1>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        <div class="bg-green-50 border border-green-200 text-green-800 text-center py-2 rounded-lg font-medium text-sm mb-4 shadow-sm">
            🔥 Total Active: <span id="group-count" class="font-bold">0</span>
        </div>

        <!-- Updated Channel Link -->
        <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="block bg-blue-600 text-white text-center py-2.5 rounded-lg font-bold mb-3 shadow hover:bg-blue-700 transition">📢 Mera Official Channel Join Karein</a>

        <a href="add.html" class="block bg-green-500 text-white text-center py-3 rounded-lg font-bold mb-4 shadow hover:bg-green-600 transition">+ Apna Group Add Karein</a>

        <input type="text" id="searchInput" oninput="filterGroups()" placeholder="🔍 Group search karein..." class="w-full p-3 border rounded-lg mb-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">

        <div id="group-list" class="space-y-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCJXVbgJQ_PJs8JhDKibJVJlUjpQ6qNxyE",
          authDomain: "whatsapp-hub-436d4.firebaseapp.com",
          projectId: "whatsapp-hub-436d4",
          storageBucket: "whatsapp-hub-436d4.firebasestorage.app",
          messagingSenderId: "720234066008",
          appId: "1:720234066008:web:d0fbd6a3ea80c154485a2d",
          measurementId: "G-36LLDV3NTM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allGroups = [];

        async function loadGroups() {
            const querySnapshot = await getDocs(collection(db, "groups"));
            allGroups = [];
            querySnapshot.forEach((doc) => { allGroups.push(doc.data()); });
            document.getElementById("group-count").innerText = allGroups.length;
            displayGroups(allGroups);
        }

        window.displayGroups = function(groups) {
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";
            groups.forEach((g) => {
                // Auto-icon based on category
                const icon = g.category === 'Gaming' ? '🎮' : g.category === 'Technology' ? '💻' : g.category === 'Education' ? '📚' : '📱';
                
                listDiv.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border flex items-center space-x-4">
                        <div class="text-3xl bg-gray-100 p-2 rounded-full">${icon}</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${g.name}</h3>
                            <span class="text-[10px] uppercase font-bold text-gray-400">${g.category}</span>
                            <div class="flex space-x-2 mt-2">
                                <a href="${g.link}" target="_blank" class="bg-green-600 text-white px-4 py-1 rounded text-xs font-bold">Join</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.filterGroups = function() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allGroups.filter(g => g.name.toLowerCase().includes(query));
            displayGroups(filtered);
        }

        loadGroups();
    </script>
</body>
</html>
