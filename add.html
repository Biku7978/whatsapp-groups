<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add WhatsApp Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-green-600 mb-4">Apna WhatsApp Group Jodein</h2>
        <form onsubmit="alert('Group successfully submit ho gaya! (Admin approval ke baad dikhega)'); window.location.href='index.html'; return false;">
            <label class="block text-sm font-medium mb-1">Group Name</label>
            <input type="text" required class="w-full p-2 border rounded mb-3">

            <label class="block text-sm font-medium mb-1">Category</label>
            <select class="w-full p-2 border rounded mb-3">
                <option>Technology</option>
                <option>Entertainment</option>
                <option>Gaming</option>
                <option>Friendship</option>
            </select>

            <label class="block text-sm font-medium mb-1">WhatsApp Group Link</label>
            <input type="url" placeholder="https://chat.whatsapp.com/..." required class="w-full p-2 border rounded mb-4">

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded font-bold">Submit Group</button>
        </form>
        <a href="index.html" class="block text-center text-sm text-gray-600 mt-4">← Home par wapas jayein</a>
    </div>
</body>
</html>
