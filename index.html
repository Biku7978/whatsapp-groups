<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-green-600 text-white p-4 text-center shadow">
        <h1 class="text-xl font-bold">📱 WhatsApp Group Hub</h1>
        <p class="text-xs mt-1">Sabhi best WhatsApp groups aur channels</p>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <!-- Action Buttons -->
        <div class="flex gap-2 mb-6">
            <a href="https://whatsapp.com/channel/0029Vb8KO7V8kyyOVT7fwn1T" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-2.5 rounded-lg font-bold text-sm shadow hover:bg-blue-700">📢 Join Channel</a>
            <a href="add.html" class="flex-1 bg-green-500 text-white text-center py-2.5 rounded-lg font-bold text-sm shadow hover:bg-green-600">+ Add Group</a>
        </div>

        <!-- Search Bar -->
        <input type="text" id="searchInput" oninput="filterGroups()" placeholder="🔍 Group search karein..." class="w-full p-2.5 border border-gray-300 rounded-lg mb-6 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">

        <!-- Groups List Container -->
        <div id="group-list" class="space-y-6">
            <p class="text-center text-gray-500">Groups load ho rahe hain...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Yahan pehle se saare groups aur channels add kiye gaye hain taaki aapko manual add na karna pade
        const preLoadedGroups = [
            // Technology
            { name: "Tech Geniuses India", type: "WhatsApp Group", category: "Technology", link: "https://chat.whatsapp.com/J3vK9s8L2mN1xPqR7tF5gH" },
            { name: "Coding & Web Tips Channel", type: "WhatsApp Channel", category: "Technology", link: "https://whatsapp.com/channel/0029V1TechTipsHub" },
            
            // Education
            { name: "English Speaking Practice", type: "WhatsApp Group", category: "Education", link: "https://chat.whatsapp.com/L4mN2pQ8rT1vK9s3xH5fG7" },
            { name: "Daily GK & Current Affairs", type: "WhatsApp Channel", category: "Education", link: "https://whatsapp.com/channel/0029V2EducationGK" },
            
            // Jobs & Internships
            { name: "Work From Home Daily Jobs", type: "WhatsApp Group", category: "Jobs & Internships", link: "https://chat.whatsapp.com/P7rT3vK1mN9s2xH5fG4L8" },
            { name: "Sarkari & Private Alerts", type: "WhatsApp Channel", category: "Jobs & Internships", link: "https://whatsapp.com/channel/0029V3JobAlerts24" },
            
            // Gaming
            { name: "BGMI & Free Fire Squads", type: "WhatsApp Group", category: "Gaming", link: "https://chat.whatsapp.com/K9s1xH4fG7L2mN8pQ3rT5" },
            
            // Entertainment
            { name: "Comedy & Fun Memes Club", type: "WhatsApp Group", category: "Entertainment", link: "https://chat.whatsapp.com/X2xH5fG7L3mN9pQ1rT4vK8" }
        ];

        let allGroups = [...preLoadedGroups];

        function displayGroups(groups) {
            const listDiv = document.getElementById("group-list");
            listDiv.innerHTML = "";

            if(groups.length === 0) {
                listDiv.innerHTML = "<p class='text-center text-gray-500'>Koi group nahi mila.</p>";
                return;
            }

            // Category wise group group karna
            const categories = {};
            groups.forEach(g => {
                const cat = g.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(g);
            });

            // HTML generate karna
            for (const [category, items] of Object.entries(categories)) {
                let html = `
                    <div class="border-b pb-4">
                        <h2 class="text-xl font-bold text-gray-900 mb-3">${category} WhatsApp Groups</h2>
                        <ul class="space-y-2.5">
                `;

                items.forEach(g => {
                    html += `
                        <li class="flex justify-between items-center text-base">
                            <span class="text-gray-700 font-medium">${g.name}</span>
                            <a href="${g.link}" target="_blank" class="text-green-600 font-bold hover:underline bg-green-50 px-3 py-1 rounded">Join</a>
                        </li>
                    `;
                });

                html += `</ul></div>`;
                listDiv.innerHTML += html;
            }
        }

        function filterGroups() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allGroups.filter(g => g.name.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query)));
            displayGroups(filtered);
        }

        // Page load hote hi dikhana shuru kar do
        displayGroups(allGroups);
    </script>
</body>
</html>
